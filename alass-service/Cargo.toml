[package]
name = "alass-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "alass-service"
path = "src/main.rs"

[dependencies]
alass-core = { version = "2.0.0", path = "../alass-core" }
webrtc-vad = "0.4.0"
subparse = "0.7.0"

tonic = "0.12"
prost = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-core = "0.3"
uuid = { version = "1", features = ["v4"] }
byteorder = "1"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"

[build-dependencies]
tonic-build = "0.12"
