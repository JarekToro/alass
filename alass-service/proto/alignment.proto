syntax = "proto3";

package alignment;

service AlignmentEngine {
  // Load or replace the subtitle file. Clears all anchors and chunk history.
  rpc LoadSubtitle(SubtitleFile) returns (LoadResult);

  // Push a raw audio chunk with its known film timestamp range.
  // Processes immediately. Returns a stream of LineChange events
  // for any subtitle lines that moved as a result.
  rpc IngestAudio(AudioChunk) returns (stream LineChange);

  // Subscribe to all LineChange events from any source (passive listener).
  rpc WatchChanges(Empty) returns (stream LineChange);

  // Current corrected subtitle file.
  rpc GetSubtitles(Empty) returns (SubtitleFile);

  // Current anchor list (for UI visualization).
  rpc GetAnchors(Empty) returns (AnchorList);

  // Processed chunk history (for UI visualization).
  rpc GetChunkHistory(Empty) returns (ChunkHistoryList);

  // Reset to original subtitle. Clears anchors and chunk history.
  rpc Reset(Empty) returns (Empty);

  // Export corrected subtitle as .srt text.
  rpc ExportSrt(Empty) returns (SrtFile);

  // Update runtime config. Takes effect on next ingest.
  rpc SetConfig(EngineConfig) returns (Empty);

  rpc GetConfig(Empty) returns (EngineConfig);
}

message AudioChunk {
  bytes  pcm_data       = 1;  // 16-bit signed LE, mono
  int32  sample_rate    = 2;  // 8000 or 16000
  int64  film_start_ms  = 3;  // absolute film position ms
  int64  film_end_ms    = 4;
}

message LineChange {
  int32  line_index      = 1;
  int64  old_start_ms    = 2;
  int64  old_end_ms      = 3;
  int64  new_start_ms    = 4;
  int64  new_end_ms      = 5;
  int64  delta_change_ms = 6;  // how much this line moved vs previous state
  float  confidence      = 7;  // confidence of the anchor that caused this
}

message SubtitleFile {
  string content  = 1;  // raw .srt or .ass text
  string format   = 2;  // "srt" | "ass"
}

message LoadResult {
  int32  line_count = 1;
  string format     = 2;
}

message AnchorList {
  repeated AnchorInfo anchors = 1;
}

message AnchorInfo {
  string id               = 1;
  int64  film_position_ms = 2;
  int64  delta_ms         = 3;
  float  confidence       = 4;
  int32  line_start       = 5;
  int32  line_end         = 6;
  string chunk_id         = 7;
}

message ChunkHistoryList {
  repeated ChunkInfo chunks = 1;
}

message ChunkInfo {
  string id              = 1;
  int64  film_start_ms   = 2;
  int64  film_end_ms     = 3;
  repeated string anchor_ids = 4;
}

message SrtFile {
  string content = 1;
}

message EngineConfig {
  float  quality_threshold     = 1;  // min nosplit score to accept a chunk
  int32  split_penalty         = 2;  // alass split_penalty, default 7
  int32  min_anchor_spacing_ms = 3;  // default 30_000
  int32  max_drift_ms          = 4;  // coarse sweep half-width, default 30_000
  int32  split_threshold_ms    = 5;  // delta jump to split anchor groups, default 500
  int32  sweep_step_ms         = 6;  // coarse sweep step size, default 1_000
  int32  coverage_buffer_ms    = 7;  // subtitle window buffer, default 10_000
  int32  stitch_tolerance_ms   = 8;  // chunk adjacency tolerance, default 5_000
}

message Empty {}
